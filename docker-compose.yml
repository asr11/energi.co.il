version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: energi_wp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: energi_wp
      MYSQL_USER: energi_user
      MYSQL_PASSWORD: energi_password
    ports:
      - "33066:3306"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    container_name: energi_wp_app
    restart: always
    ports:
      - "8085:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: energi_user
      WORDPRESS_DB_PASSWORD: energi_password
      WORDPRESS_DB_NAME: energi_wp
      WORDPRESS_TABLE_PREFIX: wpw4_
    volumes:
      - ./wp-content:/var/www/html/wp-content
    depends_on:
      - db

volumes:
  db_data:
